# Checks every push and pull request: typecheck, lint, formatting and tests
# (`npm run check`). Builds nothing, so it's quick. The Android and web
# builds stay manual (android-preview.yml, web-pages.yml).
name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint and test
        # A made-up revision, as the builds set one (tests mustn't expect "dev").
        env:
          EXPO_PUBLIC_REVISION: '1'
        run: npm run check
