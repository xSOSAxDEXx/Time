# Builds an installable Android test APK and publishes it as a GitHub
# pre-release, so it can be downloaded straight onto a phone.
#
# - Self-contained release build: the app's JavaScript is bundled in, so it
#   runs offline and needs no computer or dev server.
# - Signed with Android's standard debug key: fine for sideloading tests,
#   not for the Play Store.
#
# Run it from the Actions tab ("Run workflow").
name: Android preview build

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint and test
        run: npm run check

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Build APK
        working-directory: android
        env:
          NODE_ENV: production
        # arm64 only: every Android phone from the last several years, and a
        # much faster build.
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Name the APK
        id: apk
        run: |
          name="clocked-preview-${{ github.run_number }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$name"
          echo "path=$name" >> "$GITHUB_OUTPUT"
          ls -lh "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: clocked-preview-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}

      - name: Publish as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-preview-${{ github.run_number }}" \
            "${{ steps.apk.outputs.path }}" \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Android test build ${{ github.run_number }}" \
            --notes "Test build from ${{ github.sha }}. Open this page on your Android phone, tap the .apk under Assets to download, then open it to install (allow installs from your browser if asked). See docs/android-testing.md for what to test."
