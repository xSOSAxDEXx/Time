# Publishes the web app (installable PWA) to GitHub Pages:
#   https://<owner>.github.io/<repo>/  (here: https://xsosaxdexx.github.io/Time/)
#
# One-time setup by the repository owner: Settings → Pages → Build and
# deployment → Source: "GitHub Actions".
#
# Run it from the Actions tab ("Run workflow").
name: Web app (GitHub Pages)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, to count the revision.
          fetch-depth: 0

      - name: Revision shown in the app
        run: |
          echo "EXPO_PUBLIC_REVISION=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_BUILT=$(TZ=America/New_York date +%Y-%m-%d)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint and test
        run: npm run check

      - name: Build the web app
        env:
          # Project sites live under /<repo>/, e.g. /Time.
          EXPO_BASE_URL: /${{ github.event.repository.name }}
        run: npm run build:web

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
