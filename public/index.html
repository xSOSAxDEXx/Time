<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Punch&#39;d" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="color-scheme" content="light dark" />

    <!-- react-native-web root reset, plus the app background so nothing flashes on load -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #f6f7f9;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: #0f1216;
        }
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Date, time and list fields use the app's font, not the browser's serif default. */
      html,
      body,
      input,
      select,
      textarea {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif !important;
      }
      /* A visible ring for keyboard focus (react-native-web removes the browser's). */
      :focus-visible {
        outline: 2px solid #2563eb !important;
        outline-offset: 2px;
      }
      @media (prefers-color-scheme: dark) {
        :focus-visible {
          outline-color: #5b8cff !important;
        }
      }
    </style>
  </head>

  <body>
    <noscript>Punch&#39;d needs JavaScript turned on.</noscript>
    <div id="root"></div>
  </body>
</html>
